name: macOS audio bridge build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/macos-audio-bridge/**'
      - 'src/**'
      - '.github/workflows/macos-audio-bridge.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install opus pkg-config
      - name: Build native audio helper
        run: swift build --package-path native/macos-audio-bridge -c release
